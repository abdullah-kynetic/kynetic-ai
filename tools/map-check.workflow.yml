name: map-check
# Read-only drift check for docs/map and the context docs. No secrets, no network calls to our systems.
on:
  pull_request:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/map_check.py
