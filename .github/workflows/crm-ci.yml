name: crm-ci

on:
  pull_request:
    paths: ['crm/**', '.github/workflows/crm-ci.yml']
  push:
    branches: [main]
    paths: ['crm/**', '.github/workflows/crm-ci.yml']

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: crm

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: crm/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - name: Postgres 16 client tools (match the service version for the backup restore drill)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/pgdg.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:integration
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Shared runners are slower than the local baseline; the decided 500 ms target (DC-033) is unchanged.
          LOAD_P95_MS: '5000'
      - run: bun run build
      - name: Production deploy scripts (rehearsal with stubs, syntax, compose config)
        run: |
          for f in deploy/prod/*.sh deploy/prod/host/*.sh deploy/prod/monitor/*.sh deploy/prod/tests/*.sh; do bash -n "$f"; done
          bash deploy/prod/tests/rehearse.sh
          POSTGRES_USER=a POSTGRES_PASSWORD=b POSTGRES_DB=c PGDATA_HOST_PATH=/tmp/pg APP_BASE_URL=https://x DATABASE_URL=x DATABASE_URL_AUTH=x DATABASE_URL_WORKER=x BETTER_AUTH_SECRET=x APP_ENCRYPTION_KEY=x DATABASE_URL_MIGRATE=x DATABASE_URL_BACKUP=x BACKUP_ENCRYPTION_KEY=x SITE_ADDRESS=portal.example.test IMAGE_REPO=ghcr.io/o/r IMAGE_TAG=abc docker compose -f deploy/prod/compose.yml --profile tools config -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: crm/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: crm/playwright-report
