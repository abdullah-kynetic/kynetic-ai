name: crm-ci

on:
  pull_request:
    paths: ['crm/**', '.github/workflows/crm-ci.yml']
  push:
    branches: [main]
    paths: ['crm/**', '.github/workflows/crm-ci.yml']

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: crm

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: crm/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:integration
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: bun run build
      - name: Production deploy scripts (rehearsal with stubs, syntax, compose config)
        run: |
          for f in deploy/prod/*.sh deploy/prod/host/*.sh deploy/prod/monitor/*.sh deploy/prod/tests/*.sh; do bash -n "$f"; done
          bash deploy/prod/tests/rehearse.sh
          POSTGRES_USER=a POSTGRES_PASSWORD=b POSTGRES_DB=c PGDATA_HOST_PATH=/tmp/pg APP_BASE_URL=https://x DATABASE_URL=x DATABASE_URL_AUTH=x DATABASE_URL_WORKER=x BETTER_AUTH_SECRET=x APP_ENCRYPTION_KEY=x DATABASE_URL_MIGRATE=x SITE_ADDRESS=portal.example.test IMAGE_REPO=ghcr.io/o/r IMAGE_TAG=abc docker compose -f deploy/prod/compose.yml --profile tools config -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: crm/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: crm/playwright-report
